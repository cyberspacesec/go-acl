name: Go Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go-version: ['1.18.x', '1.21.x', '1.22.x', '1.23.x', '1.24.x']

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: 安装依赖
        run: go mod download

      - name: 运行单元测试
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: 上传覆盖率
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.txt
          flags: unittests
          fail_ci_if_error: false
          verbose: true

  examples:
    name: 示例代码测试
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: 安装依赖
        run: go mod download

      - name: 运行所有示例
        run: |
          chmod +x examples/run_all.sh
          examples/run_all.sh

  lint:
    name: 代码检查
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  benchmark:
    name: 性能基准测试
    runs-on: ubuntu-latest
    # 不阻塞主流程：即使 benchmark 失败也不影响 PR 合并
    continue-on-error: true

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: 安装依赖
        run: go mod download

      - name: 运行基准测试
        run: go test -run=^$ -bench=. -benchmem -timeout=10m ./... | tee benchmark.txt

      - name: 上传基准结果
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-results
          path: benchmark.txt
          if-no-files-found: ignore
